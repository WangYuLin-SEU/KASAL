name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel
        run: python -m build --wheel
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*.whl
      - name: Install wheel for entry-point smoke check
        run: python -m pip install --no-deps dist/*.whl
      - name: Check installed entry point outside the checkout
        working-directory: ${{ runner.temp }}
        run: kasalv2 --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kasal-6d/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
